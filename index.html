<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Hafıza Oyunu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🧠 Emoji Hafıza Oyunu</h1>
        
        <div class="controls">
            <label for="cardCount">Zorluk Seç:</label>
            <select id="cardCount">
                <option value="20">20 Kart (Çırak)</option>
                <option value="40">40 Kart (Usta)</option>
                <option value="60">60 Kart (Şampiyon)</option>
                <option value="80">80 Kart (Efsane)</option>
                <option value="100">100 Kart (İmkansız)</option>
            </select>
            <button id="startBtn">Oyunu Başlat</button>
        </div>

        <div class="stats">
            <p>Hamle: <span id="moves">0</span></p>
            <p>Eşleşme: <span id="matches">0</span> / <span id="totalMatches">10</span></p>
        </div>

        <div class="game-board" id="gameBoard"></div>

        <div class="win-screen hidden" id="winScreen">
            <h2>Tebrikler! 🎉</h2>
            <p>Tüm eşleşmeleri <span id="finalMoves">0</span> hamlede buldun.</p>
            <button id="restartBtn">Tekrar Oyna</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
